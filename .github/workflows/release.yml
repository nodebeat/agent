# Generated export: edit scripts/oss/template/ in the monorepo, not here.
#
# A pushed v* tag builds the release: archives (agent, onboard, our portable
# cosmos-validator-watcher), checksums, SBOMs, a keyless cosign signature of
# the checksums (this workflow's OIDC identity) and SLSA build provenance.
#
# Verify a download:
#   cosign verify-blob --bundle nodebeat-agent_<ver>_checksums.txt.bundle \
#     --certificate-identity-regexp '^https://github.com/nodebeat/agent/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     nodebeat-agent_<ver>_checksums.txt
#   gh attestation verify nodebeat-agent_<ver>_linux_amd64.tar.gz -R nodebeat/agent
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the GitHub release
  id-token: write      # keyless signing + provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser reads tags for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0   # goreleaser's sboms: run syft
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build the tag that triggered this run. Left to itself goreleaser
          # picks the highest tag on HEAD, and v0.1.0-rc.3 sorts above v0.1.0
          # on the same commit (v0.1.0 then built and uploaded as rc.3).
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt

# Release pipeline for the nodebeat-agent.
#
# Local validation:  `goreleaser check` and `goreleaser build --snapshot --clean`
# Real releases run in CI (.github/workflows/release.yml) from a version tag:
#   git tag -a v0.1.0 -m v0.1.0 && git push origin v0.1.0
# Signing is keyless (Sigstore Fulcio/Rekor via the workflow's OIDC
# identity); the workflow adds SLSA build provenance
# (actions/attest-build-provenance) after this config runs.
#
# Each archive also carries our portable build of cosmos-validator-watcher
# (scripts/release/build-watcher.sh, needs Docker). Alloy is not shipped:
# packaging/install.sh downloads the version pinned in packaging/deps.lock.
version: 2

before:
  hooks:
    - scripts/release/build-watcher.sh build/watcher

project_name: nodebeat-agent

builds:
  - id: nodebeat-agent
    main: ./cmd/nodebeat-agent
    binary: nodebeat-agent
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/nodebeat/agent/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
  - id: nodebeat-onboard
    main: ./cmd/nodebeat-onboard
    binary: nodebeat-onboard
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/nodebeat/agent/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - packaging/*
      - packaging/**/*
      - src: "build/watcher/{{ .Arch }}/cosmos-validator-watcher"
        dst: .
        strip_parent: true
      - src: "build/watcher/{{ .Arch }}/LICENSE"
        dst: THIRD_PARTY/cosmos-validator-watcher
        strip_parent: true

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

sboms:
  - id: default
    artifacts: archive

signs:
  - id: checksums
    cmd: cosign
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum

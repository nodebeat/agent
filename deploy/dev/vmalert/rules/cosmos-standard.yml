# Standard path: Cosmos degraded-but-not-paging signals, evaluated every
# 30s with duration guards to keep the false-positive page rate down.
# Routes to the default (non-paging) receiver.
groups:
  - name: cosmos-standard
    interval: 30s
    rules:
      - alert: CosmosMissedBlocksHigh
        expr: max by (instance) (cosmos_validator_watcher_consecutive_missed_blocks) > 5
        for: 5m
        labels:
          severity: warning
          component: consensus
          chain: cosmos
        annotations:
          summary: "Validator missing blocks for 5m ({{ $labels.instance }}, {{ $value }} consecutive)"
          description: >-
            More than 5 consecutive missed blocks sustained 5 minutes. A
            growing streak precedes downtime-jailing. Check app liveness,
            peers, and clock sync before the signing window fills.

      - alert: CosmosVotingPowerDrop
        expr: |
          (
            avg_over_time(cosmos_validator_watcher_tokens[1h])
              - cosmos_validator_watcher_tokens
          )
          / avg_over_time(cosmos_validator_watcher_tokens[1h]) > 0.1
        for: 10m
        labels:
          severity: warning
          component: consensus
          chain: cosmos
        annotations:
          summary: "Voting power down >10% over 1h ({{ $labels.instance }})"
          description: >-
            Staked tokens dropped more than 10% against the 1h average,
            sustained 10 minutes. Could be undelegation, a slash, or a
            watcher/RPC read error — confirm on-chain before reacting.

      # NOTE: p2p peer series are absent on single-node labs (verified:
      # cometbft v1.0.0 single validator exports no cometbft_p2p_* series),
      # so this rule stays silent there. The metric is real on networked
      # nodes (docs.cometbft.com metrics reference; dashboards use the
      # same tendermint_* or cometbft_* pattern as here).
      - alert: CosmosPeersLow
        expr: |
          (cometbft_p2p_peers == 0)
            or
          (tendermint_p2p_peers == 0)
        for: 10m
        labels:
          severity: warning
          component: consensus
          chain: cosmos
        annotations:
          summary: "CometBFT has no peers for 10m ({{ $labels.instance }})"
          description: >-
            Zero P2P peers for 10 minutes: check firewall (default 26656),
            persistent peers / seeds, and that the node clock is sane.

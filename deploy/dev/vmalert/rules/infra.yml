# Standard path: host infrastructure from the embedded node_exporter
# (Alloy job "prometheus.scrape.node", instance = detect target).
# All rules carry duration guards except the staleness backstop
# (NodeTelemetryStale, for: 0s — absence has no duration to guard). Only
# NodeDiskCritical pages (severity critical); the rest are warnings.
groups:
  - name: infra
    interval: 30s
    rules:
      - alert: NodeDiskLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Root disk below 15% free ({{ $labels.instance }}, {{ $value }} fraction left)"
          description: >-
            A full disk mid-sync corrupts chaindata and forces a multi-day
            resync. Free space now: prune, move chaindata, or grow the disk.

      - alert: NodeDiskCritical
        expr: |
          node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"} < 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Root disk below 5% free ({{ $labels.instance }}, {{ $value }} fraction left)"
          description: >-
            Disk-full is imminent: the EL/CL database can corrupt on the next
            write burst. Free space immediately (prune, delete old logs or
            snapshots) or stop the client cleanly before it fills.

      - alert: NodeMemoryLow
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Available memory below 10% ({{ $labels.instance }})"
          description: >-
            Sustained memory pressure risks OOM kills of EL/CL. Check for
            leaks vs. legit growth (state, caches) before raising limits.

      - alert: NodeCPUSaturated
        expr: |
          # Idle-based utilization: averaging non-idle rates across every
          # (cpu x mode) series can never reach 0.9 on multi-core hosts.
          # Average the per-cpu idle fraction instead, then invert.
          1 - avg by (instance) (
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          ) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU saturated above 90% for 15m ({{ $labels.instance }})"
          description: >-
            The node is CPU-bound: attestations risk late inclusion and EL
            falls behind under load. Identify the hot process (client,
            compaction, backup) before adding cores.

      - alert: NodeClockSkew
        expr: abs(node_timex_offset_seconds) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "System clock offset {{ $value }}s ({{ $labels.instance }})"
          description: >-
            Clock drift breaks attestation timing and peer scoring. Fix NTP
            (chrony/systemd-timesyncd) and check for VM clock issues.

      - alert: NodeTelemetryStale
        # Fires per instance known in the last 7d with no live sample
        # (set difference on label sets). A powered-off agent stops
        # remote-writing, so value/threshold expressions match nothing and
        # the alert could never exist — absence must be queried, not
        # measured. Deliberately timestamp-free: on VM v1.93
        # timestamp(last_over_time(m[7d])) returns the query step grid, not
        # the sample time, so age comparisons can never fire there.
        # Self-resolves on recovery (live sample rejoins the right side).
        # Trade-off: a deleted node keeps alerting until its series age out
        # of the window (portal deletion does not scrub VM series).
        expr: count by (instance) (last_over_time(node_uname_info[7d])) unless count by (instance) (node_uname_info)
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "No host telemetry for 3m ({{ $labels.instance }})"
          description: >-
            The node job stopped reporting: agent down, Alloy crashed, or
            remote-write broken. Chain alerts for this host cannot be
            trusted until telemetry resumes.
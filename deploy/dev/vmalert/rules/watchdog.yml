# Always-firing signal proving rule evaluation is alive. Standard Prometheus
# "watchdog" pattern; it never pages a customer channel. On SaaS, with
# WATCHDOG_PING set, the merged Alertmanager config posts it to that external
# dead-man switch every minute (one group across all tenants); dev routes it
# to "null".
groups:
  - name: watchdog
    interval: 30s
    rules:
      - alert: Watchdog
        expr: vector(1)
        for: 0s
        labels:
          severity: none
        annotations:
          summary: "Alerting pipeline is evaluating rules"
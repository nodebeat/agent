# Hot path: consensus-critical signals, evaluated every 2s, no duration
# guards. Pages via the Alertmanager `paging` route (group_wait: 0s).
#
# Metric sources: the agent's in-process poller (internal/ethpoll), which
# keeps the names/labels of the retired ethereum-metrics-exporter v0.29.2
# (see deploy/devnet/ethereum/samples/):
#   eth_exe_* - execution layer state via JSON-RPC
#   eth_con_* - consensus layer state via Beacon API
#
# Per-validator duty alerts (missed attestations, effectiveness) are NOT here
# yet (US-1.12: Beacon API duties, needs monitored validators). Health, sync
# and head-staleness are the paging signals until then.
groups:
  - name: ethereum-hot
    interval: 2s
    # VictoriaMetrics hides the newest 30s of samples by default
    # (-search.latencyOffset) and vmalert shifts eval time back to match
    # (-rule.evalDelay): +30s on every hot page (measured 2026-09-28).
    # Hot groups only: the agent's Alloy flushes remote_write every 1s
    # (batch_send_deadline), so 2s covers arrival; a late sample costs one
    # eval, not a flap.
    eval_delay: 2s
    params:
      latency_offset: ["2s"]
    rules:
      - alert: EthereumCLSyncing
        expr: eth_con_sync_is_syncing == 1
        for: 0s
        labels:
          severity: critical
          component: consensus
          chain: ethereum
        annotations:
          summary: "Consensus client is syncing ({{ $labels.instance }})"
          description: >-
            Beacon node reports syncing=1. A syncing validator cannot attest
            or propose. Check peers, check EL health, look for stalls.

      - alert: EthereumELSyncing
        expr: eth_exe_sync_is_syncing == 1
        for: 0s
        labels:
          severity: critical
          component: rpc
          chain: ethereum
        annotations:
          summary: "Execution client is syncing ({{ $labels.instance }})"
          description: >-
            EL reports syncing=1, so the beacon node cannot build valid
            payloads. Proposals from this node will fail until EL catches up.

      - alert: EthereumConsensusUnhealthy
        expr: eth_con_health_up == 0
        for: 0s
        labels:
          severity: critical
          component: consensus
          chain: ethereum
        annotations:
          summary: "Agent cannot reach the beacon node ({{ $labels.instance }})"
          description: >-
            The agent's last Beacon API poll (every 2s, 2s timeout) failed:
            beacon node down, hung, wrong URL, or the path from the agent is
            blocked. A validator client using this beacon node cannot attest
            or propose until it answers again.

      - alert: EthereumExecutionUnhealthy
        expr: eth_exe_health_up == 0
        for: 0s
        labels:
          severity: critical
          component: rpc
          chain: ethereum
        annotations:
          summary: "Agent cannot reach the execution client ({{ $labels.instance }})"
          description: >-
            The agent's last JSON-RPC poll (every 2s, 2s timeout) failed:
            execution client down, hung, or its RPC port blocked. The beacon
            node cannot build or verify payloads, and RPC users get errors.

      # Detection budget ≈ window (60s) + backend (~9s): fault → Alertmanager
      # 55-66s measured on staging 2026-09-28. Backstop for faults the
      # health flags above miss (a node that answers but stops advancing);
      # a dead or hung client pages through the health flags instead, which
      # the agent's 2s poller makes fast.
      - alert: EthereumCLHeadStalled
        expr: increase(eth_con_sync_head_slot[60s]) == 0
        for: 0s
        labels:
          severity: critical
          component: consensus
          chain: ethereum
        annotations:
          summary: "Beacon head slot not advancing ({{ $labels.instance }})"
          description: >-
            No new head slot in 60s. Chain stuck locally (peers lost, EL
            dead) or stalled globally. Value held at {{ $value }} new
            slots/60s.

      - alert: EthereumELHeadStalled
        expr: increase(eth_exe_block_most_recent_number[60s]) == 0
        for: 0s
        labels:
          severity: critical
          component: rpc
          chain: ethereum
        annotations:
          summary: "Execution head block not advancing ({{ $labels.instance }})"
          description: >-
            No new EL block in 60s. Execution client stuck, out of peers, or
            out of disk. Check EL logs and peer count.

      - alert: EthereumSyncDistanceHigh
        expr: eth_con_sync_distance > 8
        # 1m guard: a restarting node legitimately spikes sync distance
        # while catching up; a genuinely behind node stays behind.
        for: 1m
        labels:
          severity: critical
          component: consensus
          chain: ethereum
        annotations:
          summary: "Beacon node {{ $value }} slots behind head ({{ $labels.instance }})"
          description: >-
            Sync distance above 8 slots with no duration guard: on a live
            network this means the node already missed duties. If it just
            restarted, expect auto-resolve as it catches up.

      - alert: EthereumTelemetryStale
        expr: time() - timestamp(eth_con_sync_head_slot) > 180
        for: 0s
        labels:
          severity: critical
          component: consensus
          chain: ethereum
        annotations:
          summary: "No chain telemetry for 3m ({{ $labels.instance }})"
          description: >-
            Backstop for a dead exporter, dead agent, or broken remote-write:
            nothing evaluable for this node. Cannot distinguish stuck chain
            from blind monitoring without reference sources (Increment 2).